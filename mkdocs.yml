# Documentation site for https://prasad.talasila.in/chitragupta/
#
# `docs_dir: .` is the whole design, and it is load-bearing rather than
# a convenience. This repository's prose is split across two levels --
# README.md, SOUL.md, AGENTS.md, DEVELOPER.md, DEVELOPER-AGENTS.md and
# DOCKER.md at the root, everything else under docs/ -- and the two
# levels link to each other 47 times, plus 6 more from
# .claude/skills/*/SKILL.md. Staging the files into one flat tree would
# change every one of those relative paths, so the build would have to
# rewrite links, and a rewrite rule is a thing that can be wrong.
# Serving the repository as it actually is means no path changes, so
# there is nothing to rewrite: every link that works on GitHub works
# here. The seven exceptions were links into `chitragupta/` and `bench/`, which
# are code and this repo's own machinery rather than documentation --
# those now point at GitHub by absolute URL, which is where they
# belonged from either renderer.
#
# The cost is that everything not listed in `exclude_docs` below is part
# of the site, so a new top-level directory of non-prose needs a line
# there. That is the trade: one exclusion list to maintain, against a
# link-rewriting step to maintain.
#
# `docs_dir: .` needs the `same-dir` plugin because MkDocs otherwise
# refuses a docs_dir that contains mkdocs.yml. That plugin is on neither
# tier of Zensical's supported-plugin list, so if this site ever moves
# to Zensical, this file is the thing to check first.

site_name: chitragupta
site_url: https://prasad.talasila.in/chitragupta/
site_description: >-
  Turns a BibTeX bibliography into grounded survey papers, thesis chapters,
  textbook chapters and tutorials, with every citation traceable back to a
  paper the bibliography actually holds.
site_author: Prasad Talasila

repo_url: https://github.com/prasadtalasila/chitragupta
repo_name: prasadtalasila/chitragupta
edit_uri: edit/main/

copyright: Copyright &copy; Prasad Talasila

docs_dir: .
# Nested inside docs_dir, which is the repository root -- allowed only
# because `same-dir` special-cases it and `site/` is excluded below.
# Gitignored; nothing but a build ever writes here.
site_dir: site

theme:
  name: material
  locale: en
  logo: docs/logo.svg
  favicon: docs/logo.svg
  # Matched to prasad.talasila.in's own mkdocs.yml so the two builds read
  # as one site rather than two properties on one origin. If the parent's
  # palette changes, change it here too -- nothing enforces this.
  palette:
    primary: teal
    accent: orange
  features:
    - navigation.footer
    - navigation.instant
    - navigation.instant.progress
    - navigation.tabs.sticky
    - navigation.tabs
    - navigation.top
    - navigation.tracking

# Also matched to the parent, which serves /software.html rather than
# /software/. One origin with two URL styles reads as two sites.
use_directory_urls: false

plugins:
  - same-dir
  - search

markdown_extensions:
  - attr_list
  - tables
  - admonition
  # GitHub's own slug algorithm, not Python-Markdown's. Every in-page
  # link in these documents was written against a heading as GitHub
  # renders it -- `docs/CLI.md` alone has nine links to headings like
  # "`python -m chitragupta.corpus sync`", which GitHub slugs `#python--m-srccorpus-sync` and
  # Python-Markdown slugs differently. Without this the anchors silently
  # land nowhere on the site while still working in the repository.
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.details
  # The `mermaid` custom fence is what makes ```mermaid blocks render as
  # diagrams instead of as source. Without it superfences hands them to
  # pymdownx.highlight below, which is doing its job correctly -- the
  # result is a syntax-highlighted listing of the diagram's source, with
  # line numbers, which looks enough like "a code block someone meant to
  # show" that it does not read as a bug until you compare the page
  # against GitHub's rendering of the same file.
  #
  # docs/DIAGRAMS.md calls the fenced blocks "the source of truth" and
  # eleven of them carry the pipeline's only visual explanation, so this
  # is the difference between that page working and that page being a
  # wall of Mermaid syntax. Material bundles Mermaid.js and loads it on
  # seeing this class; nothing needs adding to `extra_javascript`.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      linenums: true
      use_pygments: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true

# Everything here is either code, per-host data, this repo's own
# machinery, or agent instructions that docs/GENRE.md already summarises
# for a human reader.
exclude_docs: |
  /.claude/
  /.github/
  /.venv-full/
  /.venv/
  /assets/csl/
  /assets/vale/
  /bench/
  /content/
  /docker/
  /logs/
  /papers/
  /scripts/
  /site/
  /chitragupta/
  /tests/
  /CITATION.cff
  /config.toml
  /config.toml.example
  /poetry.lock
  /poetry.toml
  /pyproject.toml
  # The patterns above are anchored to the repository root (gitignore
  # syntax) so they stop matching the sample project's own content/ and
  # papers/ under docs/examples/, which the documentation links to. What
  # stays out of the site there is only the regenerable machine state a
  # local `regenerate.sh` run leaves on disk -- the same set the sample's
  # own .gitignore keeps out of git.
  docs/examples/sample-project/content/ledger.sqlite
  docs/examples/sample-project/content/parsed/
  docs/examples/sample-project/content/chroma/
  docs/examples/sample-project/content/docling/
  docs/examples/sample-project/content/overlap/
  docs/examples/sample-project/content/*_cache.json
  docs/examples/sample-project/content/retrieval_index.json
  docs/examples/sample-project/content/pipeline.lock.db
  docs/examples/sample-project/content/pipeline.lock.db.holder
  docs/examples/sample-project/logs/

