# `docs_dir: .` serves the repo as-is so GitHub-relative links work unchanged; it needs the `same-dir`
# plugin. Anything not in exclude_docs is published, so new non-prose top-level dirs need a line there.

site_name: chitragupta
site_url: https://prasad.talasila.in/chitragupta/
site_description: >-
  Turns a BibTeX bibliography into grounded survey papers, thesis chapters,
  textbook chapters and tutorials, with every citation traceable back to a
  paper the bibliography actually holds.
site_author: Prasad Talasila

repo_url: https://github.com/prasadtalasila/chitragupta
repo_name: prasadtalasila/chitragupta
edit_uri: edit/main/

copyright: Copyright &copy; Prasad Talasila

docs_dir: .
# Inside docs_dir: allowed only via same-dir, and excluded below.
site_dir: site

theme:
  name: material
  locale: en
  logo: docs/logo.svg
  favicon: docs/logo.svg
  palette:
    primary: teal
    accent: orange
  features:
    - navigation.footer
    - navigation.instant
    - navigation.instant.progress
    - navigation.tabs.sticky
    - navigation.tabs
    - navigation.top
    - navigation.tracking

# Generated by `python scripts/render_diagrams.py --sync`; never edit it.
extra_css:
  - docs/stylesheets/mermaid.css

use_directory_urls: false

plugins:
  - same-dir
  - search

markdown_extensions:
  - attr_list
  - tables
  - admonition
  # GitHub's slug algorithm: in-page links were written against GitHub's anchors.
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.details
  # Without the mermaid fence, ```mermaid blocks render as highlighted source, not diagrams.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      linenums: true
      use_pygments: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true

exclude_docs: |
  /.agents/
  /.claude/
  /.codex/
  /.opencode/
  /.github/
  /.venv-full/
  /.venv/
  /assets/csl/
  /assets/vale/
  /assets/webapp/
  /bench/
  /content/
  /docker/
  /logs/
  /papers/
  /scripts/
  /site/
  /chitragupta/
  /tests/
  /CITATION.cff
  /config.toml
  /config.toml.example
  /uv.lock
  /pyproject.toml
  /docs/DIAGRAMS.md
  /docs/SECURITY.md
  /docs/TOPIC-MODELLING.md
  /docs/PLAGIARISM-DESIGN.md
  /docs/FIGURE-ROADMAP.md
  /docs/REQUIREMENTS.md
  /docs/AUTO-IMPROVEMENT-RATIONALE.md
  /docs/GROBID-CITATION-GRAPH.md
  /docs/FEATURE-ROADMAP.md
  /docs/UV-MIGRATION.md
  /docs/TOPIC-DISCOVERY-GRAPH.md
  /docs/CODE-STANDARDS.md
  /docs/TECHNICAL-DEBT.md
  /docs/DEV-ENV.md
  /docs/RAG.md
  /docs/INSPIRATION.md
  /docs/MODEL-COMPLIANCE.md
  /plans/
  docs/examples/sample-project/content/ledger.sqlite
  docs/examples/sample-project/content/parsed/
  docs/examples/sample-project/content/chroma/
  docs/examples/sample-project/content/docling/
  docs/examples/sample-project/content/overlap/
  docs/examples/sample-project/content/*_cache.json
  docs/examples/sample-project/content/retrieval_index.json
  docs/examples/sample-project/content/pipeline.lock.db
  docs/examples/sample-project/content/pipeline.lock.db.holder
  docs/examples/sample-project/logs/

