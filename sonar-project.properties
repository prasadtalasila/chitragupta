sonar.projectKey=prasadtalasila_chitragupta
sonar.organization=prasadtalasila

# Populated by ci.yml's `sonarqube` job, which downloads the `test` job's
# own coverage.xml (the Linux/100%-coverage leg) as a build artifact into
# the repo root rather than re-running the suite here -- see that job's
# comments. Without this, SonarCloud's "Coverage on New Code" gate
# condition reads every new line as uncovered, since nothing tells it
# where a report would be even if the scan step could see one.
sonar.python.coverage.reportPaths=coverage.xml

# `sonar.sources` explicit (not left to the implicit `.` default) is
# load-bearing here, not cosmetic: declaring `sonar.tests` below while
# `sonar.sources` is unset is a known scanner conflict -- confirmed on
# this exact PR, where it silently indexed *only* the 6 files under
# `sonar.tests` as the whole project (42 files, matching tests/'s own
# file count to the file) and dropped every chitragupta/, scripts/ and bench/
# file from analysis entirely: new_coverage vanished from the quality
# gate instead of improving, new_duplicated_lines_density read 0.0
# because CPD ran "for 0 files", and the four real findings from the
# previous run (S8707 x2, S3776 x2) disappeared along with the files
# they were in -- a quiet green gate, not a fixed one.
#
# `.` alone reintroduced a second, sharper failure: `sonar.sources=.`
# and `sonar.tests=tests` both then matched every file under tests/,
# and this scanner version treats that overlap as a hard error --
# "File tests/test_enrich_docling_parse.py can't be indexed twice" --
# rather than silently reclassifying it, which the two together are
# often assumed to do. `sonar.exclusions` below carves tests/ back out
# of the main-source set (it does not touch `sonar.tests`, which has
# its own, separate exclusion property), making the two sets the
# disjoint ones the scanner is asking for, while `.` still keeps every
# non-Python asset (docs/, .github/, README.md) in scope.
sonar.sources=.
sonar.exclusions=tests/**

# `tests/` is test code, not main source -- without this, Sonar reads
# every line of every test *file* as new code needing its own coverage
# (coverage.xml, from `--cov=chitragupta --cov=scripts`, never instruments
# tests/ itself, so those lines always read as 0% regardless of how
# thoroughly the tests they're in exercise chitragupta/).
sonar.tests=tests

# `bench/` is this repo's own parser/benchmark harness, deliberately
# outside the coverage floor `pyproject.toml` enforces -- see
# bench/bench_overlap_gate.py's own docstring ("bench/ sits outside CI's
# coverage targets ... and outside the clean-code ratchet"). Excluded
# from the coverage *gate* specifically, not from analysis generally: a
# real bug in bench/ should still surface as a code-smell/vulnerability
# finding, just not as a coverage shortfall against a floor this repo
# never asked bench/ to clear.
sonar.coverage.exclusions=bench/**


# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=chitragupta
#sonar.projectVersion=1.0


# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8
