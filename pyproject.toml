# The distribution is `chitragupta-cli` (`chitragupta` is taken on PyPI);
# the import package and executables are `chitragupta`. uv manages the lock;
# poetry-core is the build backend only (docs/PACKAGING.md).
[project]
name = "chitragupta-cli"
version = "7.3.0"
description = "Bib-sync, citation-gate, and genre-writing pipeline for a research corpus."
authors = [{ name = "Prasad Talasila" }]
license = { text = "MIT" }
# Must stay README.md: `uv sync` reads it on every install (#286).
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    # 2.x only splits blocks; bib_parse/bib_latex restate 1.x's output.
    # Before lifting the cap, rerun tests/test_bib_parse.py and test_bib_latex.py.
    "bibtexparser>=2.1,<3.0",
]

[project.optional-dependencies]
# torch is reinstalled from a driver-matched CUDA index by
# install_full_pipeline.sh's ensure_gpu_torch after this extra installs.
enrich = [
    # <2.15 is load-bearing: 2.15 has CUDA 13.2 builds only, so older
    # drivers would silently run CPU-only.
    "torch>=2.14,<2.15",
    "torchvision>=0.29,<1.0",
    "sentence-transformers>=5.7,<6.0",
    "chromadb>=1.5,<2.0",
    "bertopic>=0.17,<0.18",
    "docling>=2.125,<3.0",
    # SPECTER2-only (#194); forces transformers 4.57.x.
    "adapters>=1.3,<2.0",
    "scipy>=1.18,<2.0",
    "networkx>=3.6,<4.0",
    "pypdfium2>=5.13,<6.0",
]
images = [
    # Same torch window as `enrich`.
    "torch>=2.14,<2.15",
    "diffusers>=0.37,<0.44",
    "transformers>=4.57.6,<6.0",
    "accelerate>=1.16,<2.0",
]
webapp = [
    # `chitragupta webapp` only (#1262); imported nowhere else.
    "fastapi>=0.165,<0.166",
    "uvicorn>=0.54,<0.55",
]
dev = [
    "pytest>=9.0,<10.0",
    # 7.x does not measure subprocesses: cover `main()` with an in-process test.
    "pytest-cov>=7.1,<8.0",
    "pytest-xdist>=3.8,<4.0",
    "pyyaml>=6.0,<7.0",
    # TestClient for the webapp's FastAPI app.
    "httpx>=0.29,<0.30",
]
docs = [
    "mkdocs-material>=9.7,<10.0",
    "mkdocs-same-dir==0.1.5",
]

[project.urls]
Homepage = "https://prasad.talasila.in/chitragupta/"
Repository = "https://github.com/prasadtalasila/chitragupta"
Documentation = "https://prasad.talasila.in/chitragupta/"

[project.scripts]
chitragupta = "chitragupta.__main__:main"
cg = "chitragupta.__main__:main"

[tool.poetry]
packages = [{ include = "chitragupta" }]
include = [
    { path = "assets", format = ["sdist", "wheel"] },
    # Listed entry by entry so developer-only skills (#1188) stay out;
    # tests/test_developer_skills.py names any missing entry.
    { path = ".claude/agents", format = ["sdist", "wheel"] },
    { path = ".claude/hooks", format = ["sdist", "wheel"] },
    { path = ".claude/settings.json", format = ["sdist", "wheel"] },
    { path = ".claude/skills-common", format = ["sdist", "wheel"] },
    { path = ".claude/skills/agenda-reviser", format = ["sdist", "wheel"] },
    { path = ".claude/skills/ai-images", format = ["sdist", "wheel"] },
    { path = ".claude/skills/book-assembler", format = ["sdist", "wheel"] },
    { path = ".claude/skills/corpus-reviser", format = ["sdist", "wheel"] },
    { path = ".claude/skills/deep-research", format = ["sdist", "wheel"] },
    { path = ".claude/skills/draft-reviser", format = ["sdist", "wheel"] },
    { path = ".claude/skills/figure-drawer", format = ["sdist", "wheel"] },
    { path = ".claude/skills/review-digest", format = ["sdist", "wheel"] },
    { path = ".claude/skills/survey-writer", format = ["sdist", "wheel"] },
    { path = ".claude/skills/textbook-chapter-writer", format = ["sdist", "wheel"] },
    { path = ".claude/skills/thesis-chapter-writer", format = ["sdist", "wheel"] },
    { path = ".claude/skills/tutorial-writer", format = ["sdist", "wheel"] },
    { path = ".codex", format = ["sdist", "wheel"] },
    { path = ".agents/skills/agenda-reviser", format = ["sdist", "wheel"] },
    { path = ".agents/skills/ai-images", format = ["sdist", "wheel"] },
    { path = ".agents/skills/book-assembler", format = ["sdist", "wheel"] },
    { path = ".agents/skills/corpus-reviser", format = ["sdist", "wheel"] },
    { path = ".agents/skills/deep-research", format = ["sdist", "wheel"] },
    { path = ".agents/skills/draft-reviser", format = ["sdist", "wheel"] },
    { path = ".agents/skills/figure-drawer", format = ["sdist", "wheel"] },
    { path = ".agents/skills/review-digest", format = ["sdist", "wheel"] },
    { path = ".agents/skills/survey-writer", format = ["sdist", "wheel"] },
    { path = ".agents/skills/textbook-chapter-writer", format = ["sdist", "wheel"] },
    { path = ".agents/skills/thesis-chapter-writer", format = ["sdist", "wheel"] },
    { path = ".agents/skills/tutorial-writer", format = ["sdist", "wheel"] },
    { path = ".opencode/chitragupta", format = ["sdist", "wheel"] },
    { path = ".opencode/opencode.json", format = ["sdist", "wheel"] },
    { path = ".opencode/plugins", format = ["sdist", "wheel"] },
    { path = ".opencode/skills/agenda-reviser-opencode", format = ["sdist", "wheel"] },
    { path = ".opencode/skills/ai-images-opencode", format = ["sdist", "wheel"] },
    { path = ".opencode/skills/book-assembler-opencode", format = ["sdist", "wheel"] },
    { path = ".opencode/skills/corpus-reviser-opencode", format = ["sdist", "wheel"] },
    { path = ".opencode/skills/deep-research-opencode", format = ["sdist", "wheel"] },
    { path = ".opencode/skills/draft-reviser-opencode", format = ["sdist", "wheel"] },
    { path = ".opencode/skills/figure-drawer-opencode", format = ["sdist", "wheel"] },
    { path = ".opencode/skills/review-digest-opencode", format = ["sdist", "wheel"] },
    { path = ".opencode/skills/survey-writer-opencode", format = ["sdist", "wheel"] },
    { path = ".opencode/skills/textbook-chapter-writer-opencode", format = ["sdist", "wheel"] },
    { path = ".opencode/skills/thesis-chapter-writer-opencode", format = ["sdist", "wheel"] },
    { path = ".opencode/skills/tutorial-writer-opencode", format = ["sdist", "wheel"] },
    { path = "docs", format = ["sdist", "wheel"] },
    { path = "AGENTS.md", format = ["sdist", "wheel"] },
    { path = "CLAUDE.md", format = ["sdist", "wheel"] },
    { path = "SOUL.md", format = ["sdist", "wheel"] },
    { path = "README.md", format = ["sdist", "wheel"] },
    { path = "DOCKER.md", format = ["sdist", "wheel"] },
    { path = "config.toml.example", format = ["sdist", "wheel"] },
    { path = "scripts/install_full_pipeline.sh", format = ["sdist", "wheel"] },
]

[tool.uv]
# A lock range, not the published one. The <3.15 bound and the 3.14.1 hole
# come from triton and torchvision metadata; without them the lock resolves
# to wheels with no cp314 build (#607). The three platforms exclude
# emscripten, where onnxruntime has no wheels.
environments = [
    "sys_platform == 'linux' and python_full_version >= '3.12' and python_full_version != '3.14.1' and python_full_version < '3.15'",
    "sys_platform == 'darwin' and python_full_version >= '3.12' and python_full_version != '3.14.1' and python_full_version < '3.15'",
    "sys_platform == 'win32' and python_full_version >= '3.12' and python_full_version != '3.14.1' and python_full_version < '3.15'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "real_resolver_loaders: run discover's real model loaders instead of tests/conftest.py's refusal",
    "slow: compiles with a real TeX engine; CI's Linux leg deselects it, a local run keeps it",
]

[tool.coverage.run]
source = ["chitragupta", "scripts", ".claude/hooks", ".claude/skills/demo-recorder/scripts", ".claude/skills/ai-images/scripts"]
branch = true
omit = [
    "*/enrich/__init__.py",
]

[tool.coverage.report]
# Coverage is held at 100%; Windows uses coveragerc-windows.toml (#291).
fail_under = 100
precision = 2
exclude_lines = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]


# RUF100 makes every `# noqa: BLE001` a checked claim; ruff is pinned in
# ci.yml because its verdicts move between versions.
[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "BLE", "RUF100"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "E402"]


[build-system]
requires = ["poetry-core>=2.0,<3.0"]
build-backend = "poetry.core.masonry.api"
