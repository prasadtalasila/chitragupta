# This IS a publishable package. docs/PACKAGING.md records the decision,
# the objections it had to answer, and which of them survive; the short
# version is that the import package could not be called `src` -- a
# top-level `src` in site-packages claims the most generic name on the
# index -- so it is `chitragupta`, while the *distribution* is
# `chitragupta-cli` because `chitragupta` is taken on PyPI by an
# unrelated project.
#
# Three names that look like one, and only the first is registered
# anywhere:
#
#   name         = "chitragupta-cli"   the PyPI project    (globally unique)
#   packages     = chitragupta         the import package  (unregistered)
#   scripts      = chitragupta, cg     the executables     (unregistered)
#
# `poetry install` still replaces the old docker/requirements-full.txt +
# requirements-dev.txt + hand-run `python3 -m venv` -- see
# scripts/install_full_pipeline.sh, still the install path for a
# checkout, Docker and CI.
[tool.poetry]
name = "chitragupta-cli"
version = "6.66.0"
packages = [{ include = "chitragupta" }]
# Everything below is not Python, so `packages` above doesn't reach it --
# `poetry build` includes only what `packages`/`include` name. Each entry
# ships to both sdist and wheel (an unadorned string here defaults to
# sdist only) and lands as a *sibling* of `chitragupta/` at the top of
# the installed environment, e.g. `site-packages/assets/csl/ieee.csl` --
# exactly where `chitragupta/config.py`'s `shipped()` already looks
# (`PACKAGE_ROOT.parent`), so that function needs no change once these
# ship (#263). `chitragupta init` (#263) reads `.claude/`, `docs/` and
# the four root `.md` files from the same sibling location.
include = [
    { path = "assets", format = ["sdist", "wheel"] },
    { path = ".claude", format = ["sdist", "wheel"] },
    { path = "docs", format = ["sdist", "wheel"] },
    { path = "AGENTS.md", format = ["sdist", "wheel"] },
    { path = "CLAUDE.md", format = ["sdist", "wheel"] },
    { path = "SOUL.md", format = ["sdist", "wheel"] },
    { path = "README.md", format = ["sdist", "wheel"] },
    { path = "config.toml.example", format = ["sdist", "wheel"] },
    # `chitragupta install` (#265) reads this one file, always invoked as
    # `bash <path> <stage>` rather than executed directly -- so the
    # executable bit surviving the packaging route (it does not, on
    # every route -- #265's own trap) is not load-bearing here.
    { path = "scripts/install_full_pipeline.sh", format = ["sdist", "wheel"] },
]

description = "Bib-sync, citation-gate, and genre-writing pipeline for a research corpus."
authors = ["Prasad Talasila"]
license = "MIT"
homepage = "https://prasad.talasila.in/chitragupta/"
repository = "https://github.com/prasadtalasila/chitragupta"
documentation = "https://prasad.talasila.in/chitragupta/"
# Without one of these, PyPI's project page shows only `description`
# above (one line) and nothing else -- confirmed against the real,
# already-published chitragupta-cli 6.7.0, whose page had an empty long
# description *and* no "Project links" sidebar, because neither `readme`
# nor `homepage`/`repository` was declared when that release was built.
#
# This has to stay README.md, not a generated rewrite of it, even though
# PyPI's renderer breaks on README.md's relative links and images (see
# release.yml's "Rewrite README.md for the PyPI-bound build" step for
# that fix). `readme` is read by `poetry install` too, not just `poetry
# build` -- every `install_full_pipeline.sh python-deps`/`os-deps`
# install, on every host and in CI's own test job, does a real project
# install and needs this file to exist. Pointing it at a generated,
# gitignored file broke `test (windows-latest)` and `test
# (ubuntu-latest)` both, the first time this was tried (#286) -- the
# "Build release archive" step that would have generated it runs only in
# release.yml, never in ci.yml.
readme = "README.md"

# Two executables, one entry point, one distribution. `cg` is *not* a
# second PyPI project -- a console script name is not a PyPI name, and
# docs/NAME.md floats `cg` as the alias for a command that is accurate
# but long. docs/PACKAGING.md has the three-namespaces table.
[tool.poetry.scripts]
chitragupta = "chitragupta.__main__:main"
cg = "chitragupta.__main__:main"

[tool.poetry.dependencies]
python = "^3.12"
# The one dependency the otherwise-stdlib core pipeline needs
# (chitragupta/bib_reader.py, used by `python -m chitragupta.corpus sync`): hand-rolling a
# correct BibTeX parser (nested braces, LaTeX escapes, multi-line
# values) isn't worth it. `python -m chitragupta.draft gate` needs none of
# this and still runs with the bare system interpreter, no venv at all.
bibtexparser = ">=1.4,<2.0"
# <2.0 is load-bearing, not just a style choice: bibtexparser v2 replaces
# BibTexParser/customization/bibtexparser.load with a different,
# incompatible API (bibtexparser.parse_file, no customization hook) that
# chitragupta/bib_reader.py -- the sole source of citekeys -- doesn't use. Don't
# relax this ceiling without rewriting that module against v2's API first.

# Mirrors of the three optional groups below, purely so `pip install
# 'chitragupta-cli[enrich|dev|docs]'` resolves at all (#265). Poetry groups
# and extras are unrelated mechanisms -- a group dependency never reaches
# a built wheel's metadata, only `[tool.poetry.dependencies]` marked
# `optional = true` plus the `[tool.poetry.extras]` table below do, so
# each package with a `poetry install --with X` home needs a second,
# duplicate declaration here to also have a `pip install ...[X]` one.
# Two lists that must agree will drift -- `tests/test_pyproject_extras.py`
# asserts these match the corresponding group's names and versions
# exactly, name for name, constraint for constraint.
sentence-transformers = {version = ">=5.6,<6.0", optional = true}
chromadb = {version = ">=1.5,<2.0", optional = true}
bertopic = {version = ">=0.17,<0.18", optional = true}
docling = {version = ">=2.115,<3.0", optional = true}
adapters = {version = ">=1.2,<2.0", optional = true}
# scipy was always installed transitively (bertopic -> hdbscan/umap);
# chitragupta/enrich/topic_graph.py imports it directly (hypergeom,
# linkage), and a direct import deserves a declared version.
scipy = {version = ">=1.10,<2.0", optional = true}
# Same story as scipy: it arrived transitively with docling (which uses
# it as one of its own PDF backends), and chitragupta/enrich/_docling_crops.py
# now imports it directly to render one figure crop at a time instead of
# letting docling hold every bitmap to the end of the parse (#600).
# Pillow is *not* declared alongside it despite `bitmap.to_pil()`: docling
# depends on Pillow directly, so it cannot be absent wherever this is.
pypdfium2 = {version = ">=5.12,<6.0", optional = true}
pytest = {version = ">=8.0,<9.0", optional = true}
pytest-cov = {version = ">=5.0,<7.0", optional = true}
mkdocs-material = {version = ">=9.5,<10.0", optional = true}
mkdocs-same-dir = {version = ">=0.1.5,<0.2", optional = true}

[tool.poetry.extras]
enrich = [
    "sentence-transformers",
    "chromadb",
    "bertopic",
    "docling",
    "adapters",
    "scipy",
    "pypdfium2",
]
dev = ["pytest", "pytest-cov"]
docs = ["mkdocs-material", "mkdocs-same-dir"]

# Optional group (`poetry install --with enrich`): everything chitragupta/enrich/*
# (the Docling/embeddings/Pandoc pipeline, chitragupta/enrich/__main__.py)
# needs. All of the below were installed and import-verified in a host
# venv on 2026-07-28 (docker/requirements-full.txt, since replaced by this
# group); sentence-transformers/chromadb/bertopic/docling were also
# functionally verified against this repo's real corpus (bib parsing,
# embeddings+search, topic modeling, PDF parsing all produced correct
# output). Re-verified against this exact poetry.lock on 2026-07-30 --
# note the resolved versions aren't necessarily the same ones checked on
# 2026-07-28 (e.g. torch resolved to 2.7.1+cu126 this time, not the
# 2.6.0+cu124 verified when this lock was first generated); re-verify
# after any `poetry lock` re-resolution rather than assuming this note
# still describes what's actually pinned.
#
# 2026-08-16: adding `adapters` below re-resolved this lock and pulled
# transformers down from 5.x (5.8.1/5.14.1, split by platform marker) to
# a single 4.57.6 everywhere, and huggingface-hub from 1.26.0 to 0.36.2
# to match -- adapters 1.3.0 pins `transformers = ">=4.57.6,<4.58.0"`, a
# single-patch-version window, so any future adapters bump will likely
# drag transformers with it again. The 2026-07-30 functional
# verification above predates this and was against transformers 5.x;
# `tests/` (docling/chromadb/bertopic/sentence-transformers modules, 211
# tests) was re-run against 4.57.6 the same day and passed. The
# corpus-level functional check the paragraph above describes was also
# re-run, separately from the unit suite: sentence-transformers (real
# encode), chromadb (real embed+search), bertopic (real fit) and docling
# (real parse of a real corpus PDF) were each exercised for real against
# transformers 4.57.6 on 2026-08-16 and all four passed.
#
# torch itself is NOT listed here -- it's a transitive dependency (pulled
# in by sentence-transformers/docling/accelerate), and
# scripts/install_full_pipeline.sh's ensure_gpu_torch deliberately
# reinstalls it from a CUDA-version-matched wheel index *after* this
# group installs, diverging from whatever plain version this lockfile
# resolved (which is whatever CUDA major version is current upstream --
# see that function's own comment for why a driver-aware post-install
# step is unavoidable here; poetry has no concept of "pick a different
# index based on the host's GPU driver").
[tool.poetry.group.enrich]
optional = true

[tool.poetry.group.enrich.dependencies]
sentence-transformers = ">=5.6,<6.0"
chromadb = ">=1.5,<2.0"
bertopic = ">=0.17,<0.18"
docling = ">=2.115,<3.0"
# Direct import in topic_graph.py -- see the mirrored optional entry
# above for why this is declared despite arriving transitively anyway.
scipy = ">=1.10,<2.0"
# Direct import in _docling_crops.py, same reasoning (#600).
pypdfium2 = ">=5.12,<6.0"

# adapters is SPECTER2-only -- allenai/specter2_base loads its
# task-specific adapter weights (proximity/classification/etc.) through
# this library, not through sentence-transformers/transformers alone.
# Added for issue #194's Arm B (retrieval/reranking benchmark); not
# imported by anything else in chitragupta/enrich, so if SPECTER2 is ever
# dropped from that arm this is the line to remove with it. Resolved to
# 1.3.0 and import-verified (`from adapters import AutoAdapterModel`) in
# .venv-full on 2026-08-16 -- see the note above this dependency block
# about the transformers downgrade this pin forces.
adapters = ">=1.2,<2.0"

# Optional group (`poetry install --with dev`): pytest/pytest-cov are
# dev-time tooling, not needed to run the pipeline itself -- but the test
# suite they run is NOT correspondingly light: tests/ exercises
# bibtexparser (bib_reader) and the whole enrich group
# (docling/chromadb/bertopic/sentence-transformers via
# their own test modules), so `poetry install --with enrich` must already
# have run before `--with dev` for the full suite to pass.
[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0,<9.0"
pytest-cov = ">=5.0,<7.0"

# Optional group (`poetry install --only docs`): builds the documentation
# site at https://prasad.talasila.in/chitragupta/ from mkdocs.yml. Nothing
# else needs it -- no module imports mkdocs, no test runs it, and
# scripts/install_full_pipeline.sh deliberately does not install it, since
# a docs build is not part of getting the pipeline running.
# .github/workflows/docs.yml is the only consumer, and it uses `--only
# docs` so a docs build never installs the enrich stack it has no use for.
#
# mkdocs-same-dir is what makes mkdocs.yml's `docs_dir: .` legal, and that
# is what lets the site be this repository as it stands -- no staging
# step, no link rewriting. It is a 0.x pin because upstream has never
# released a 1.0, and it is on neither tier of Zensical's supported-plugin
# list: if this site ever moves to Zensical, this is the line to check.
[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
mkdocs-material = ">=9.5,<10.0"
mkdocs-same-dir = ">=0.1.5,<0.2"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
# .claude/hooks is in scope because those two files enforce the citekey
# invariant and report when that enforcement has stopped -- code the bar
# should apply to at least as much as anything under chitragupta/. It only became
# measurable once tests/test_hook_modules.py started importing them:
# spawning a hook, which is how the harness runs it and what the other two
# hook test files do, contributes no coverage at all.
source = ["chitragupta", "scripts", ".claude/hooks"]
branch = true
omit = [
    "*/enrich/__init__.py",
]

[tool.coverage.report]
# The 100% bar DEVELOPER-AGENTS.md states, enforced rather than asserted.
# It holds on a host with the full toolchain (pandoc, TeX Live, poppler)
# installed -- without those binaries the render/pdf tests self-skip and
# take chitragupta/render_output.py down to ~76%, which is a missing dependency
# rather than a missing test. Pass --cov-fail-under=0 on such a host.
#
# CI's Windows leg holds this same 100, not a lower floor: it uses
# `coveragerc-windows.toml` instead of this section, which excludes
# exactly the lines that are genuinely untestable there -- the
# pandoc/pdflatex/pdftotext call sites `os-deps` never installs, and the
# multiprocessing-forkserver/shebang-script branches that platform lacks
# outright -- rather than budgeting for the gap under a lower number.
# See #291 for why a floor was the wrong shape, and
# tests/test_coverage_configs_agree.py for what pins the two configs
# together.
fail_under = 100
# Two decimal places, because a rounded total is not a number you can set a
# threshold from -- 99.97% would display as "100%" and pass a bare integer
# floor. It also makes the strictness of `fail_under = 100` visible: 99.97
# is reported as 99.97 and fails, rather than rounding away the gap.
precision = 2
exclude_lines = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]


# The per-site suppression check pylint's category-wide
# `broad-exception-caught` disable can't be (docs/TECHNICAL-DEBT.md's
# ruff subsection). `select` is deliberately narrower than ruff's own
# (much broader) default: BLE is the rule this was adopted for, E/F are
# pyflakes/pycodestyle's core correctness checks plus the "keep lines
# short" review rule CODE-STANDARDS.md's build order already named for
# ruff, and RUF100 is what makes a `# noqa: BLE001` a checked claim
# instead of a comment nothing reads -- it fails a noqa that no longer
# suppresses anything. ruff's version is pinned exactly in ci.yml for
# this reason as much as for Sonar S8544: RUF100's verdict on a given
# except block depends on ruff's own (undocumented, narrower-than-BLE001
# looks) carve-outs, e.g. a block that ends in `raise`, and a version
# bump can move that verdict without this project changing a line.
[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "BLE", "RUF100"]

# An `__init__.py` re-exporting a submodule's public name so `from
# chitragupta import x` reaches it (registry/, spec/, unit/, dossier/,
# render_output/, review/figure_layout/) is F401 by construction, and
# four of those do it via a deliberately late import (E402) to dodge a
# circular import at definition time -- both already explained inline
# where DEVELOPER-AGENTS.md's comment rules require it. A blanket
# ignore here, not a per-line noqa on each of the 52 sites, because
# per-file-ignores is ruff's own register for exactly this shape.
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "E402"]


# Required now that this is a real distribution: without it `pip install`
# and `poetry build` have no backend to call. poetry-core rather than
# poetry itself is the documented choice -- it is the build backend
# alone, with none of the CLI's own dependency tree.
[build-system]
requires = ["poetry-core>=1.9"]
build-backend = "poetry.core.masonry.api"
