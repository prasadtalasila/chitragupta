# Vale configuration for drafts this pipeline produces.
#
# Read by `python -m chitragupta.draft style`, never by a bare `vale` run: the
# command copies this file to a temp location and appends one line
# enabling the dialect rule that matches the draft's recorded
# `language:`, the same way chitragupta/render_output.py copies assets/csl/ieee.csl
# rather than editing it in place. This file therefore stays
# byte-identical to what was reviewed.
#
# StylesPath is relative to this file, so the whole of assets/vale/ moves
# or ships as one unit.
StylesPath = styles
MinAlertLevel = suggestion

# LaTeX is not one of Vale's native markup formats, and without this
# mapping a .tex fragment is scanned as plain text: BlockIgnores below is
# silently not applied, so every word inside a verbatim/lstlisting block
# is reported. Mapping it to Markdown is what makes the ignores fire.
# thesis-chapter-writer emits .tex, so this line is load-bearing for one
# of the eight drafting skills.
[formats]
tex = md

[*.{md,tex}]
BasedOnStyles = chitragupta

# The quoted-span exemption. Fenced code, indented code and inline code
# spans need no rule here -- Vale's Markdown scoping already excludes
# them, which is most of the exemption and the reason a markup-aware tool
# was chosen over a hand-rolled one. What is left is the three classes it
# does not know about:
#
#  1. Block quotations. A draft quotes its sources by construction, and a
#     source's own spelling is not this draft's error to fix.
#  2. The references section. chitragupta/references.py splices titles straight
#     out of the ledger's bib_fields into the draft, so its spelling is
#     the source's. The heading varies by genre -- a tutorial calls it
#     "Further reading" and a numbered chapter "N. References" -- so all
#     three spellings are matched, to the next heading or end of file.
#  3. LaTeX verbatim environments, which are .tex's code fences.
BlockIgnores = (?sm)^(> .*?)(?:\n\n+|\z), \
  (?sm)^(#+ +(?:[\d.]+ +)?(?:References|Further reading|Bibliography|Works cited)\b.*?)(?:\n#+ |\z), \
  (?s)(\\begin\{(?:verbatim|lstlisting|minted|Verbatim|lstinputlisting)\}.*?\\end\{(?:verbatim|lstlisting|minted|Verbatim|lstinputlisting)\})

# The third pattern is a Markdown document name -- AGENTS.md,
# CODE-STANDARDS.md, SOUL.md. These are filenames, not prose, and the
# Acronyms rule read every one of them as an unexpanded acronym: 119 of
# the 536 findings a first run over `docs/` produced, and the single
# largest false-positive class. Ignored as a token rather than listed in
# that rule's exceptions, because the stems are not acronyms and listing
# them there would suppress a genuine `CODE` or `DESIGN` elsewhere.
#
# LaTeX citation commands carry citekeys, not prose. A citekey cannot
# match a rule token by accident -- \bobviously\b does not match inside
# smith_obviously_2020, since underscores are word characters -- but a
# multi-word title in a \citet[...] optional argument can, so the whole
# command is skipped rather than relying on that.
TokenIgnores = (\\cite[a-zA-Z]*\s*(\[[^\]]*\])*\{[^}]*\}), (\$[^$]*\$), (\b[A-Z][A-Z0-9-]*\.md\b)
