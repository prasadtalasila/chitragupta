# Vale configuration for drafts this pipeline produces.
#
# Read by `python -m chitragupta.draft style`, never by a bare `vale` run:
# the command passes this file as `--config` and adds a `--filter` that
# enables the dialect rule matching the draft's recorded `language:`.
# Nothing is copied or edited, so this file stays byte-identical to what
# was reviewed.
#
# StylesPath is relative to this file, so the whole of assets/vale/ moves
# or ships as one unit.
StylesPath = styles
MinAlertLevel = suggestion

# LaTeX is not one of Vale's native markup formats, and without this
# mapping a .tex fragment is scanned as plain text: BlockIgnores below is
# silently not applied, so every word inside a verbatim/lstlisting block
# is reported. Mapping it to Markdown is what makes the ignores fire.
# thesis-chapter-writer emits .tex, so this line is load-bearing for one
# of the eight drafting skills.
[formats]
tex = md

[*.{md,tex}]
BasedOnStyles = chitragupta

# Third-party rules, one line each. Their files under styles/ are copied
# byte-identical from a pinned release, and only the files listed here
# are copied: a package is not in BasedOnStyles, so a rule file added
# beside these runs nowhere until it gets a line. The level is lowered
# here rather than in the file, since every package ships its rules at
# `warning` or `error` and this check is advisory. Which section of
# WRITING-STANDARDS.md each rule implements, and why the rest of each
# package was left out, is in README.md; tests/test_style_vendored.py
# fails when this list, the files and that table part.
proselint.Cliches = suggestion
proselint.Hedging = suggestion
proselint.Hyperbole = suggestion
proselint.Malapropisms = suggestion
proselint.Needless = suggestion
proselint.Nonwords = suggestion
proselint.Oxymorons = suggestion
proselint.RASSyndrome = suggestion
proselint.Skunked = suggestion
proselint.Uncomparables = suggestion
proselint.Very = suggestion
ai-tells.ClosingPleasantries = suggestion
ai-tells.ConclusionMarkers = suggestion
ai-tells.ContrastiveFormulas = suggestion
ai-tells.NegatedPair = suggestion
ai-tells.PromotionalPuffery = suggestion
ai-tells.PseudoCleft = suggestion
ai-tells.StackedHedges = suggestion
ai-tells.SycophancyMarkers = suggestion
Journals.EtAl = suggestion
Journals.Hype = suggestion
Journals.PValueCase = suggestion
Journals.PValueZero = suggestion
Journals.Placeholder = suggestion
Journals.Prove = suggestion
Journals.Significant = suggestion
Journals.UnitSpacing = suggestion
Journals.UnitSymbols = suggestion
PLOS.PValues = suggestion
Microsoft.Plurals = suggestion
Microsoft.Uppercase = suggestion
Microsoft.Wordiness = suggestion

# The quoted-span exemption. Fenced code, indented code and inline code
# spans need no rule here -- Vale's Markdown scoping already excludes
# them, which is most of the exemption and the reason a markup-aware tool
# was chosen over a hand-rolled one. A quotation inside a sentence is
# exempted after Vale runs, by chitragupta/style_quotes.py, because a
# pattern here has to span lines and was measured to lose findings
# outside the quote. What is left here is the three classes Vale does
# not know about:
#
#  1. Block quotations. A draft quotes its sources by construction, and a
#     source's own spelling is not this draft's error to fix.
#  2. The references section. chitragupta/references.py splices titles straight
#     out of the ledger's bib_fields into the draft, so its spelling is
#     the source's. The heading varies by genre -- a tutorial calls it
#     "Further reading" and a numbered chapter "N. References" -- so all
#     three spellings are matched, to the next heading or end of file.
#  3. LaTeX verbatim environments, which are .tex's code fences.
BlockIgnores = (?sm)^(> .*?)(?:\n\n+|\z), \
  (?sm)^(#+ +(?:[\d.]+ +)?(?:References|Further reading|Bibliography|Works cited)\b.*?)(?:\n#+ |\z), \
  (?s)(\\begin\{(?:verbatim|lstlisting|minted|Verbatim|lstinputlisting)\}.*?\\end\{(?:verbatim|lstlisting|minted|Verbatim|lstinputlisting)\})

# The third pattern is a Markdown document name -- AGENTS.md,
# CODE-STANDARDS.md, SOUL.md. These are filenames, not prose, and the
# Acronyms rule read every one of them as an unexpanded acronym: 119 of
# the 536 findings a first run over `docs/` produced, and the single
# largest false-positive class. Ignored as a token rather than listed in
# that rule's exceptions, because the stems are not acronyms and listing
# them there would suppress a genuine `CODE` or `DESIGN` elsewhere.
#
# LaTeX citation commands carry citekeys, not prose. A citekey cannot
# match a rule token by accident -- \bobviously\b does not match inside
# smith_obviously_2020, since underscores are word characters -- but a
# multi-word title in a \citet[...] optional argument can, so the whole
# command is skipped rather than relying on that.
#
# For a .tex draft, `draft style` blanks the citation, math and command
# spans itself before Vale sees the text (chitragupta/style_latex.py),
# because these entries were measured to lose findings in long
# paragraphs; they still apply to a .md draft and to a bare vale run.
#
# LaTeX command names (#1187). Vale reads a .tex fragment as Markdown, so
# `\centering` and `\begin{center}` reach the rules as prose, and the
# word `center` in them is reported as an en-US spelling. One entry covers
# `\begin{env}` / `\end{env}` and a bare `\command`: measured with Vale
# 3.26.0, two separate entries (environment, then command) hid every
# finding in prose beside a `\begin{...}` line, so do not split it. Only
# the command name is skipped; `\emph{obviously}` is still checked.
#
# The exercise label `**Exercise N (Objective M, easy|medium|hard).**` is
# a convention (WRITING-STANDARDS.md section 2), and the grade in it is not
# the defect marker "easy". The entry is anchored on the label, so "easy"
# in running prose is still reported, and so is any other word in a bold
# `**Exercise ...**` that is not the whole label. The label has a comma,
# written `\x2C` because the ini splits entries on commas even inside
# a `[,]` class (measured with Vale 3.26.0).
#
# Entries are comma-separated, so none may contain a literal comma.
TokenIgnores = (\\cite[a-zA-Z]*\s*(\[[^\]]*\])*\{[^}]*\}), (\$[^$]*\$), (\b[A-Z][A-Z0-9-]*\.md\b), \
  (\\(?:(?:begin|end)\{[^}]*\}|[A-Za-z]+\*?)), \
  (\*\*Exercise \d+ \(Objective \d+\x2C (?:easy|medium|hard)\)\.\*\*)
