extends: substitution
message: "Use '%s' instead of '%s' -- scope.md records en-US (WRITING-STANDARDS.md §8)."
link: https://github.com/prasadtalasila/chitragupta/blob/main/docs/WRITING-STANDARDS.md
level: warning
ignorecase: true
# The mirror of DialectGB, with one addition: -ise/-isation, which en-US
# does not accept and en-GB does (both -ise and Oxford -ize are British).
# Words that are -ise in every dialect -- advertise, comprise, exercise,
# supervise, surprise and the rest -- are absent by construction; see
# assets/vale/README.md.
swap:
  behaviour(s|al|ally)?: behavior$1
  colour(s|ed|ing|ful)?: color$1
  endeavour(s|ed|ing)?: endeavor$1
  favour(s|ed|ing|able|ably)?: favor$1
  flavour(s|ed|ing)?: flavor$1
  harbour(s|ed|ing)?: harbor$1
  honour(s|ed|ing|able)?: honor$1
  labour(s|ed|ing)?: labor$1
  neighbour(s|ing|hood)?: neighbor$1
  rumour(s|ed)?: rumor$1
  savour(s|ed|ing)?: savor$1
  vapour(s)?: vapor$1
  analyse(s|d|r|rs)?: analyze$1
  analysing: analyzing
  catalyse(s|d)?: catalyze$1
  paralyse(s|d)?: paralyze$1
  calibre: caliber
  centre(s|d)?: center$1
  centring: centering
  fibre(s)?: fiber$1
  litre(s)?: liter$1
  theatre(s)?: theater$1
  defence(s|less)?: defense$1
  offence(s)?: offense$1
  pretence: pretense
  cancelled: canceled
  cancelling: canceling
  fuelled: fueled
  labelled: labeled
  labelling: labeling
  modelled: modeled
  modelling: modeling
  signalling: signaling
  travelled: traveled
  travelling: traveling
  fulfil(s|led|ling|ment)?: fulfill$1
  instil(s|led|ling)?: instill$1
  skilful(ly)?: skillful$1
  # -ise, en-US only
  characteris(e|es|ed|ing|ation): characteriz$1
  emphasis(e|es|ed|ing): emphasiz$1
  formalis(e|es|ed|ing|ation): formaliz$1
  generalis(e|es|ed|ing|ation): generaliz$1
  initialis(e|es|ed|ing|ation): initializ$1
  maximis(e|es|ed|ing): maximiz$1
  minimis(e|es|ed|ing): minimiz$1
  normalis(e|es|ed|ing|ation): normaliz$1
  optimis(e|es|ed|ing|ation): optimiz$1
  organis(e|es|ed|ing|ation): organiz$1
  prioritis(e|es|ed|ing): prioritiz$1
  realis(e|es|ed|ing): realiz$1
  recognis(e|es|ed|ing): recogniz$1
  specialis(e|es|ed|ing|ation): specializ$1
  standardis(e|es|ed|ing|ation): standardiz$1
  summaris(e|es|ed|ing): summariz$1
  synchronis(e|es|ed|ing|ation): synchroniz$1
  utilis(e|es|ed|ing|ation): utiliz$1
  visualis(e|es|ed|ing|ation): visualiz$1
