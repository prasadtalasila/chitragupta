# Long-lived `claude remote-control` host. Copy .env.example to .env; every variable is documented there.
# Pick a profile (cpu or gpu): a `deploy` nvidia reservation makes `up` fail outright without the toolkit.
name: ${CHITRAGUPTA_PROJECT_NAME:-chitragupta}

# Shared by both services, which differ only by `deploy:`; they share a container name, one runs at a time.
x-claude: &claude
  build:
    context: .
    dockerfile: Dockerfile.claude
    args:
      CG_USER: ${CHITRAGUPTA_USER:?set CHITRAGUPTA_USER in docker/.env -- see .env.example}
      CG_UID: ${CHITRAGUPTA_UID:?set CHITRAGUPTA_UID in docker/.env to your `id -u`}
      CG_GID: ${CHITRAGUPTA_GID:?set CHITRAGUPTA_GID in docker/.env to your `id -g`}
  image: chitragupta-claude:${CHITRAGUPTA_IMAGE_TAG:-latest}
  container_name: ${CHITRAGUPTA_CONTAINER_NAME:-chitragupta-claude}

  # Required, not defaulted: a wrong default uid silently writes files owned by someone else.
  user: ${CHITRAGUPTA_USER:?set CHITRAGUPTA_USER in docker/.env -- see .env.example}

  # Without hostname/CLAUDE_AGENT_NAME the agent registers under the container's short id.
  hostname: ${CHITRAGUPTA_CONTAINER_NAME:-chitragupta-claude}
  # The image's WORKDIR is empty when CHITRAGUPTA_WORKSPACE_DIR moves the mount.
  working_dir: ${CHITRAGUPTA_WORKSPACE_DIR:-/workspace}
  environment:
    CLAUDE_AGENT_NAME: ${CHITRAGUPTA_CONTAINER_NAME:-chitragupta-claude}
    # Must equal the mount target below. Unset RC_* vars arrive empty, which rc-daemon.env treats as unset.
    RC_DIR: ${CHITRAGUPTA_WORKSPACE_DIR:-/workspace}
    RC_NAME: ${RC_NAME:-}
    RC_PREFIX: ${RC_PREFIX:-}
    RC_PERMISSION_MODE: ${RC_PERMISSION_MODE:-bypassPermissions}
    RC_SPAWN: ${RC_SPAWN:-}
    RC_VENV: ${RC_VENV:-}

  volumes:
    # `:?`, not a default. Containers sharing CHITRAGUPTA_CLAUDE_HOME need distinct workspace targets,
    # or the second one takes over the first one's remote-control session.
    - ${CHITRAGUPTA_WORKSPACE:?set CHITRAGUPTA_WORKSPACE to the host directory to mount in the container}:${CHITRAGUPTA_WORKSPACE_DIR:-/workspace}
    - ${CHITRAGUPTA_CLAUDE_HOME:-./claude}:/home/${CHITRAGUPTA_USER}/.claude
    # Carries ~/.claude.json's oauthAccount (needed by remote-control); the agent can read the whole file.
    # Long syntax for create_host_path: false, so a mistyped path fails `up` instead of creating a root dir.
    - type: bind
      source: ${CHITRAGUPTA_CLAUDE_JSON:-/dev/null}
      target: /home/${CHITRAGUPTA_USER}/.claude.host.json
      read_only: true
      bind:
        create_host_path: false
    # Read-only: the agent runs with bypassPermissions and must not rewrite source PDFs.
    - ${CHITRAGUPTA_PAPERS:-${CHITRAGUPTA_WORKSPACE}/papers}:${CHITRAGUPTA_WORKSPACE_DIR:-/workspace}/papers:ro

  restart: unless-stopped

  # Catches tmux/supervisor death only; a missing login still reports healthy (see `docker logs`).
  healthcheck:
    test: ["CMD", "rc-daemon.sh", "status"]
    interval: 60s
    timeout: 5s
    retries: 3
    start_period: 20s

services:
  claude:
    <<: *claude
    profiles: ["cpu"]

  # Needs the NVIDIA Container Toolkit on the host.
  claude-gpu:
    <<: *claude
    profiles: ["gpu"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
