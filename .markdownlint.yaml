# markdownlint configuration, adopted from DTaaS
# (INTO-CPS-Association/DTaaS), the same source docs/CODE-STANDARDS.md
# takes this project's code standards from.
#
# ENFORCED. `.github/workflows/ci.yml`'s `lint` job runs this at a binary
# zero-messages bar -- see docs/TECHNICAL-DEBT.md's 5.3 for the baseline
# it was adopted from (947 findings, 839 of them MD060) and the order the
# two linters were adopted in.
#
# Run it with:
#   markdownlint-cli2 "*.md" "docs/**/*.md" ".claude/**/*.md"
default: true

# Inline HTML. This repository's README uses a <picture>/<source srcset>
# block for the dark-mode logo, which has no Markdown spelling.
MD033: false

# Table cell padding, and 89% of the baseline on its own (839 of 947).
# This is the judgement docs/TECHNICAL-DEBT.md's 5.3 left to whoever
# adopted the linter, and it is declined: the alternative is a 839-line
# diff that touches every table in the documentation to move spaces
# around, changing no rendered output and burying the substantive history
# of those files. The tables here are hand-aligned and read well already.
# Everything else in the baseline is enforced.
MD060: false

MD013:
  code_blocks: false
  tables: false

MD046:
  style: "fenced"

# There is no `overrides:` block here, and the one inherited from
# upstream has been removed rather than corrected. `overrides` is a
# markdownlint-**cli2** feature, read from `.markdownlint-cli2.yaml`; a
# plain `.markdownlint.yaml` like this one is the library's own config
# schema and ignores the key silently. The inherited block was therefore
# inert twice over -- it named `.github/` paths, which this project's lint
# scope (`"*.md" "docs/**/*.md"`) does not reach either.
#
# Per-file exceptions are inline directives instead, at the one site that
# needs one: `README.md`'s `markdownlint-disable-next-line MD041`, which
# carries its reason beside it and cannot quietly stop applying.
