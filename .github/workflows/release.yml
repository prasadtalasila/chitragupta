name: Release

on:
  push:
    tags:
      - 'v*'

# Each tag is its own github.ref, so this only ever cancels a re-run of
# the *same* tag (e.g. a force-pushed/re-pushed tag) -- never one
# release's run against a different version's, which always groups
# separately. Added for consistency with ci.yml, not because this repo's
# documented release flow (DEVELOPER-AGENTS.md) ever re-pushes a tag.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Catches the plausible human mistake of tagging a release before
      # bumping pyproject.toml's version (or vice versa) -- scripts/release.py
      # names its archive from pyproject.toml alone, so a mismatch here
      # would otherwise silently ship a release/chitragupta-<old
      # version>.zip under a new-version tag.
      - name: Verify tag matches pyproject.toml version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pyproject_version="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['tool']['poetry']['version'])")"
          if [ "$tag_version" != "$pyproject_version" ]; then
            echo "Tag ${GITHUB_REF_NAME} (version $tag_version) does not match pyproject.toml's version $pyproject_version" >&2
            exit 1
          fi

      # scripts/release.py is stdlib-only (tomllib/zipfile/shutil) and
      # only needs `git` on PATH (already true after actions/checkout) --
      # no poetry/enrich-group install needed just to build the archives.
      # Builds both release/chitragupta-<version>.zip and
      # release/chitragupta-docker-<version>.zip in one run.
      - name: Build release archives
        run: python3 scripts/release.py

      # Three archives, three different questions. The full zip is the
      # whole project directory -- docs, .claude/ skills, hooks, config
      # example -- for someone who wants to work in a checkout. The
      # docker-only zip is docker/ and docs/RUNNING-WITH-DOCKER.md alone,
      # for someone who wants to run a container without the rest of the
      # repository. The wheel installs the code and the CLI, and is what
      # `publish-pypi` below hands to PyPI.
      - name: Install Poetry
        run: pipx install poetry==2.4.1

      # pyproject.toml's `readme` stays README.md (poetry install reads
      # it too, not just poetry build, so it has to be a file every
      # checkout actually has -- see that file's own comment; pointing
      # it at a generated file broke ci.yml's install step the first
      # time this was tried, #286). This overwrites README.md with
      # scripts/release.py's absolute-link rewrite of it in *this*
      # checkout only, right before the one build that reaches PyPI --
      # never committed, and gone the moment this job's runner is.
      - name: Rewrite README.md for the PyPI-bound build
        run: cp README.pypi.md README.md

      - name: Build wheel and sdist
        run: poetry build

      # Named with an underscore, not a hyphen: a distribution name
      # normalises that way in a wheel filename, so `chitragupta-cli-*`
      # would silently match nothing and attach no artefact.
      # `release/chitragupta-*.zip` matches both the full and docker-only
      # archives -- their names share the `chitragupta-` prefix.
      - name: Show what will be attached
        run: ls -l release/chitragupta-*.zip dist/chitragupta_cli-*

      # Pinned to a commit SHA rather than the `v2` tag (which currently
      # resolves to this same commit, v2.6.2), for the reason ci.yml's
      # Codecov pin states: S7637 -- a movable tag on a third-party action
      # running with `contents: write` is exactly the dependency to pin.
      # Bump it deliberately, by resolving the tag again.
      # Handed to the publish job rather than rebuilt there, so what
      # reaches PyPI is byte-identical to what is attached to the
      # release. Two `poetry build` runs are not guaranteed to agree.
      - name: Keep the built distributions for the publish job
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            release/chitragupta-*.zip
            dist/chitragupta_cli-*.whl
            dist/chitragupta_cli-*.tar.gz
          generate_release_notes: true

  # Separate job, and separate permissions. Trusted Publishing needs an
  # OIDC token; the release job needs to write releases. Neither needs
  # the other's, and `permissions:` is per job, so splitting them is what
  # keeps the OIDC token off every step that has no business holding one.
  #
  # `needs: release` orders it *after* the GitHub Release is published,
  # deliberately: a PyPI failure then leaves a complete, downloadable
  # release behind rather than a tag with no artefacts.
  #
  # Only a major or minor release publishes here. `endsWith(github.ref_name,
  # '.0')` is true for X.0.0 and X.Y.0, false for X.Y.Z with Z > 0 -- and
  # PyPI never accepts a re-upload of a version number, not even a
  # deleted or yanked one, so a run of PATCH releases (docs-only fixes,
  # CI-only changes -- DEVELOPER-AGENTS.md's "Versioning and releases")
  # was each permanently spending a slot on the index for a change a PyPI
  # install doesn't need to see quickly. A patch tag still gets a GitHub
  # Release with the wheel/sdist attached -- the `release` job above runs
  # unconditionally -- it just does not also reach PyPI; `pip install
  # chitragupta-cli` always resolves to the latest X.Y.0 either way.
  publish-pypi:
    needs: release
    if: endsWith(github.ref_name, '.0')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # the OIDC token Trusted Publishing exchanges
    steps:
      - name: Fetch the distributions the release job built
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # No API token, and no secret in repository settings: Trusted
      # Publishing exchanges GitHub's OIDC token for a short-lived PyPI
      # one, so there is no long-lived credential to leak or rotate.
      #
      # The publisher is registered on PyPI against this repository, this
      # workflow filename and the `pypi` environment above -- every major
      # or minor tag since v6.7.0 that reached this job has published
      # cleanly (docs/PACKAGING.md); a PATCH tag no longer reaches it at
      # all, per the `if:` above, rather than reaching it and failing.
      # A failure here now is a real regression (a renamed environment,
      # a changed OIDC trust relationship, a PyPI-side outage), not the expected
      # state: it was only expected once, before that first tag, and this
      # comment used to say so. If it fails, the tag and the GitHub
      # Release still land -- this job runs after both, and a failure
      # here is confined to it.
      #
      # The project is `chitragupta-cli`, not `chitragupta`: that name
      # belongs to an unrelated package on PyPI. docs/PACKAGING.md has
      # the three-namespaces table and why the command is still
      # `chitragupta`.
      #
      # Pinned to a commit SHA for the reason the release action above
      # is: a movable tag on a third-party action that can publish to
      # PyPI is strictly worse than one that can write a release.
      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
