name: Release

on:
  push:
    tags:
      - 'v*'

# Each tag is its own github.ref, so this only ever cancels a re-run of
# the *same* tag (e.g. a force-pushed/re-pushed tag) -- never one
# release's run against a different version's, which always groups
# separately. Added for consistency with ci.yml, not because this repo's
# documented release flow (DEVELOPER-AGENTS.md) ever re-pushes a tag.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Catches the plausible human mistake of tagging a release before
      # bumping pyproject.toml's version (or vice versa) -- scripts/release.py
      # names its archive from pyproject.toml alone, so a mismatch here
      # would otherwise silently ship a release/chitragupta-<old
      # version>.zip under a new-version tag.
      - name: Verify tag matches pyproject.toml version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pyproject_version="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['tool']['poetry']['version'])")"
          if [ "$tag_version" != "$pyproject_version" ]; then
            echo "Tag ${GITHUB_REF_NAME} (version $tag_version) does not match pyproject.toml's version $pyproject_version" >&2
            exit 1
          fi

      # scripts/release.py is stdlib-only (tomllib/zipfile/shutil) and
      # only needs `git` on PATH (already true after actions/checkout) --
      # no poetry/enrich-group install needed just to build the archive.
      - name: Build release archive
        run: python3 scripts/release.py

      # Pinned to a commit SHA rather than the `v2` tag (which currently
      # resolves to this same commit, v2.6.2), for the reason ci.yml's
      # Codecov pin states: S7637 -- a movable tag on a third-party action
      # running with `contents: write` is exactly the dependency to pin.
      # Bump it deliberately, by resolving the tag again.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: release/chitragupta-*.zip
          generate_release_notes: true
