name: Release

# Only vX.0.0/vX.Y.0 release; patch versions are never tagged. `+` repeats, `.` is literal.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # Second guard behind the tag filter: no job here may release a patch.
  release:
    if: endsWith(github.ref_name, '.0')
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify tag matches pyproject.toml version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pyproject_version="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          if [ "$tag_version" != "$pyproject_version" ]; then
            echo "Tag ${GITHUB_REF_NAME} (version $tag_version) does not match pyproject.toml's version $pyproject_version" >&2
            exit 1
          fi

      - name: Build release archives
        run: python3 scripts/release.py

      - name: Install uv
        run: pipx install --pip-args='--only-binary=:all:' uv==0.13.9

      - name: Rewrite README.md for the PyPI-bound build
        run: cp README.pypi.md README.md

      - name: Build wheel and sdist
        run: uv build

      # Underscore, not hyphen: wheel filenames normalise the name, so `chitragupta-cli-*` matches nothing.
      - name: Show what will be attached
        run: ls -l release/chitragupta-*.zip dist/chitragupta_cli-*

      - name: Keep the built distributions for the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            release/chitragupta-*.zip
            dist/chitragupta_cli-*.whl
            dist/chitragupta_cli-*.tar.gz
          generate_release_notes: true

  # Separate job so only it holds the OIDC token; runs only after the release job succeeds.
  publish-pypi:
    needs: release
    runs-on: ubuntu-26.04
    environment: pypi
    permissions:
      id-token: write   # the OIDC token Trusted Publishing exchanges
    steps:
      - name: Fetch the distributions the release job built
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      # Trusted Publishing (no secret); the PyPI project is `chitragupta-cli`.
      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
