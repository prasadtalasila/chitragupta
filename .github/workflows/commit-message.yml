name: Commit message

# Its own workflow so `edited` re-runs only this check, not ci.yml's whole suite.
on:
  pull_request:
    branches: [main, improve-figures]
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commit-message:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      # The PR body is attacker-controlled: pass it via env:, never ${{ }} in run:.
      - name: Check the commit message section
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$BODY" | python scripts/merge_pr.py --check
