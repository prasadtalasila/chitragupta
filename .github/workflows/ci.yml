name: CI

# `branches`, never `tags-ignore`: tag-only filters stop branch runs entirely.
on:
  push:
    branches: [main, improve-figures]
  pull_request:
    branches: [main, improve-figures]
  workflow_dispatch:

# Never cancel on main: two quick merges share a group, and a cancelled run uploads no base coverage.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create config.toml from the tracked example
        shell: bash
        run: cp config.toml.example config.toml

      # No `restore-keys` (#512): `uv sync --inexact` never uninstalls, so a prefix hit keeps removed packages.
      - name: Name the runner image for the venv cache key
        id: image
        shell: bash
        run: echo "os=${ImageOS:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Restore the .venv-full cache
        id: venv-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .venv-full
          key: venv-${{ runner.os }}-${{ steps.image.outputs.os }}-${{ hashFiles('uv.lock') }}

      # Runs unconditionally, even on a cache hit: it doubles as the install script's end-to-end test.
      - name: Install OS + Python dependencies (os-deps + python-deps)
        if: runner.os == 'Linux'
        run: bash scripts/install_full_pipeline.sh all

      - name: Swap torch for the cpu-only build (no GPU on a hosted runner)
        if: runner.os == 'Linux'
        run: bash scripts/install_full_pipeline.sh cpu-torch

      # Pinned, wheels-only (S8544); bump with docs.yml, release.yml and scripts/uv-requirements.txt.
      - name: Install uv
        shell: bash
        run: pip install --only-binary ':all:' uv==0.13.9

      - name: Install Python dependencies (python-deps only -- os-deps is Linux/apt-only)
        if: runner.os != 'Linux'
        shell: bash
        run: bash scripts/install_full_pipeline.sh python-deps

      - name: Install dev dependencies (pytest/pytest-cov)
        shell: bash
        run: bash scripts/install_full_pipeline.sh dev-deps

      - name: Report whether the venv cache was a hit
        shell: bash
        run: |
          if [ "${{ steps.venv-cache.outputs.cache-hit }}" = "true" ]; then
            echo "venv cache: HIT for ${{ steps.venv-cache.outputs.cache-primary-key }}"
          else
            echo "venv cache: MISS for ${{ steps.venv-cache.outputs.cache-primary-key }} (installing from an empty .venv-full)"
          fi

      - name: Save the .venv-full cache (main only, on a miss)
        if: github.ref == 'refs/heads/main' && steps.venv-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .venv-full
          key: ${{ steps.venv-cache.outputs.cache-primary-key }}

      # `--no-sync` keeps the cpu-torch swap; marking more tests `slow` fails the 100% floor.
      - name: Run test suite with coverage
        shell: bash
        env:
          HF_HUB_OFFLINE: "1"
        run: |
          export VIRTUAL_ENV="$PWD/.venv-full"
          set -o pipefail
          uv run --active --no-sync python -m pytest -n auto -m "not slow" --cov --cov-report=term-missing \
            --cov-report=xml --cov-fail-under=100 --cov-config=coveragerc-windows.toml -rf | tee pytest-output.txt

      - name: Report which tests failed
        if: failure()
        shell: bash
        run: |
          {
            echo "### Test failures on ${{ matrix.os }}"
            echo '```'
            sed -n '/short test summary info/,$p' pytest-output.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E '^(FAILED|ERROR) ' pytest-output.txt | while read -r line; do
            echo "::error::${{ matrix.os }}: ${line}"
          done

      - name: Upload coverage.xml for the SonarQube job
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 1

      # `fail_ci_if_error: false`: coverage is decided locally; an upload error is not about the code.
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage.xml
          disable_search: true
          flags: ${{ matrix.os }}
          name: ${{ matrix.os }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: uv lock --check
        shell: bash
        run: uv lock --check

  launchers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No setup-python on purpose: it would add the very `python` whose presence is being tested.
      - name: Report any registered hook launcher that cannot start
        shell: bash
        run: |
          py=python3
          command -v "$py" >/dev/null 2>&1 || py=python
          "$py" -c "import sys; from pathlib import Path; from chitragupta import hook_launchers; faults = hook_launchers.faults(Path('.claude/settings.json')); print('\n'.join('::error::' + f for f in faults)); sys.exit(1 if faults else 0)"

  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create config.toml from the tracked example
        shell: bash
        run: cp config.toml.example config.toml

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install pylint and the runtime dependency
        run: python -m pip install pylint==4.0.7 bibtexparser==2.1.0

      # Pinned exactly: ruff's undocumented carve-outs decide RUF100/BLE001 verdicts.
      - name: Install ruff
        run: python -m pip install ruff==0.16.4

      - name: Fetch main and tags for the version check
        run: git fetch --quiet --depth=1 origin "+refs/heads/main:refs/remotes/origin/main" "+refs/tags/*:refs/tags/*"

      # pull_request only: on a push to main it compares main to itself and always fails.
      - name: Version bump has not been lost to a collision
        if: github.event_name == 'pull_request'
        run: python3 scripts/check_version_bump.py

      - name: pylint
        run: pylint --rcfile=.pylintrc chitragupta scripts .claude/hooks

      - name: ruff
        run: ruff check chitragupta scripts .claude/hooks

      - name: ruff format --check
        run: ruff format --check chitragupta scripts tests bench .claude/hooks

      - name: shellcheck
        run: shellcheck scripts/*.sh git-hooks/pre-commit docker/*.sh

      - name: Install actionlint
        run: bash scripts/install_full_pipeline.sh actionlint

      - name: actionlint
        run: actionlint

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # 24, not 20: --test-coverage-include/--test-coverage-lines need node >= 22.8.
          node-version: "24"

      # Pinned (Sonar S8543); `--ignore-scripts` (S6505) refuses registry install hooks.
      - name: Install markdownlint-cli2
        run: npm install -g --ignore-scripts markdownlint-cli2@0.23.2

      # Keep these globs in step with scripts/check_local.sh; !.claude/worktrees matters locally.
      - name: markdownlint
        run: markdownlint-cli2 "*.md" "docs/**/*.md" ".claude/**/*.md" ".agents/**/*.md" ".opencode/**/*.md" "plans/**/*.md" "!docs/examples/sample-project" "!docs/examples/*/content" "!.claude/worktrees"

      - name: Install webapp dev dependencies (acorn)
        run: npm ci --ignore-scripts

      - name: Test the webapp modules
        run: >-
          node --test --experimental-test-coverage
          --test-coverage-include="assets/webapp/*.js"
          --test-coverage-lines=100
          tests/webapp/*.test.js

      - name: Test the OpenCode plugin helpers
        run: node --test tests/opencode/*.test.mjs

      - name: Install Vale
        run: bash scripts/install_full_pipeline.sh vale

      - name: Vale config parses and the exemptions hold
        run: bash scripts/check_style_exemptions.sh

  # No path filter: narrowing filters fail invisibly. TORCH_VARIANT=cpu keeps the image small.
  docker-build:
    name: Docker build
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: docker build -f docker/Dockerfile --build-arg TORCH_VARIANT=cpu .
        run: docker build -f docker/Dockerfile --build-arg TORCH_VARIANT=cpu -t chitragupta:ci .

  sonarqube:
    name: SonarQube
    # One job only: a second scan of the same projectKey overwrites the first.
    needs: test
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download coverage.xml from the test job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: coverage-xml

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@70bad232163b09d998ea0707ee80c0ec80798c16 # v8.5.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
