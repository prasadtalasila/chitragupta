name: CI

# `branches`, not `tags-ignore`. The intent has always been "run on
# merges, don't double-run on a release tag that release.yml already
# handles", and `tags-ignore: v*` on its own did the opposite of that.
# GitHub's rule: when a `push` trigger carries **only** tag filters, the
# workflow does not run on branch pushes at all. So from the commit that
# added it (6388bad4, 2026-07-31) this workflow stopped running on `main`
# entirely -- 81 commits landed without one, the last push-event run being
# 47d3b99e on the day the filter went in.
#
# The visible cost was Codecov: it had no report for the base commit, so
# every PR comment carried "Please upload report for BASE" and the project
# dashboard had nothing to show. The reason it was invisible for so long
# is that `pull_request` kept firing, so PRs were still checked and the
# only thing missing was the one run nobody watches.
#
# Naming `main` rather than `'**'` keeps a PR branch push from starting a
# second, redundant run beside its `pull_request` one; tags match neither
# filter, which is the original intent stated positively.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A push to the same branch/PR while a previous run is still going
# (routine during iterative fix-and-repush work, e.g. addressing a
# Copilot review comment) cancels that stale, now-superseded run
# instead of letting both consume CI minutes -- github.ref is stable
# per branch/PR, so this only ever cancels an earlier run of the same
# ref, never a different branch's.
#
# Never cancel on `main`, though: two PRs merged in close succession both
# push `refs/heads/main` and so share a group, and the second would kill
# the first. A cancelled run uploads nothing, which would leave Codecov
# without the base report the `push` trigger above exists to produce --
# the same symptom, arrived at a different way.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # windows-latest was exploratory (docs/DESIGN.md's cross-platform-CI
    # recommendation) and carried `continue-on-error` while real gaps were
    # found and fixed one at a time. They have been: the leg has run clean
    # -- every step green, no failing test -- for ten consecutive runs, so
    # it now blocks like the Linux one rather than reporting success
    # whatever happens. What it does *not* share is the coverage bar: it
    # gets python-deps without os-deps (apt-only), so ~30 render/pdf tests
    # self-skip there and the total lands near 99% against Linux's 100%.
    # That difference is a missing toolchain, and the floor below is set
    # for it rather than the leg being exempted from checking at all.
    steps:
      - uses: actions/checkout@v4

      # config.toml is gitignored per-host data, so a checkout never has
      # one -- and src/config.py reads it at *import* time and fails hard
      # when it's absent (deliberately: see its own comment). Without this
      # step every test in the suite dies on collection, not just the
      # config ones. CI is the plain example file, unedited, which is also
      # a free check that the shipped example still parses.
      - name: Create config.toml from the tracked example
        shell: bash
        run: cp config.toml.example config.toml

      # Dogfoods the project's own single install path (DEVELOPER-AGENTS.md: "don't
      # add a second install path") rather than hand-rolling equivalent
      # steps here -- this is also, itself, a real end-to-end test that
      # the install script still works on a clean host.
      - name: Install OS + Python dependencies (os-deps + python-deps)
        if: runner.os == 'Linux'
        run: bash scripts/install_full_pipeline.sh all

      # os-deps' apt-get also installs Poetry itself (python3-poetry) on
      # Linux -- python-deps' check_poetry() has no other way to find it
      # on a host that skipped os-deps, confirmed by this leg's first
      # real run (poetry not found, exit 1). install_full_pipeline.sh's
      # own check_poetry() already documents "or install Poetry
      # manually" as the accepted non-apt path; this is that, scoped to
      # CI rather than added to the shared script (a real end user's
      # Windows host isn't necessarily bootstrapping Poetry via CI's
      # exact mechanism).
      - name: Install Poetry (non-Linux only -- os-deps' apt-get is Linux-specific)
        if: runner.os != 'Linux'
        shell: bash
        run: pip install poetry

      # os-deps (apt-get: poppler-utils, TeX Live, Pandoc) is
      # Linux-only -- Windows gets the pure-Python python-deps stage
      # only, so pdftotext/pandoc/pdflatex-dependent tests
      # self-skip there (DEVELOPER.md's "Running tests") rather than
      # this step failing outright.
      - name: Install Python dependencies (python-deps only -- os-deps is Linux/apt-only)
        if: runner.os != 'Linux'
        shell: bash
        run: bash scripts/install_full_pipeline.sh python-deps

      - name: Install dev dependencies (pytest/pytest-cov)
        shell: bash
        run: bash scripts/install_full_pipeline.sh dev-deps

      # poetry run (not a hardcoded .venv-full/bin/python) resolves
      # correctly on both venv layouts (POSIX bin/ vs a native Windows
      # Python's Scripts/) via poetry.toml's virtualenvs.create = false
      # + VIRTUAL_ENV, instead of this workflow needing to know which
      # one .venv-full actually has.
      # Two floors, because the two legs run different amounts of the suite.
      # Linux installs os-deps and runs all of it, so it holds pyproject's
      # [tool.coverage.report] fail_under = 100. Windows gets python-deps
      # only (os-deps is apt-only: pandoc, TeX Live, poppler), so ~30
      # render/pdf tests self-skip and src/render_output.py lands at ~76%,
      # taking the total near 99%. 95 is a floor under that, not a target:
      # it catches pure-Python coverage collapsing on a platform where the
      # suite is partial, without re-tuning every time a pandoc-only line
      # is added. Raise it only against a measured number -- `precision = 2`
      # is set so the report prints one.
      - name: Run test suite with coverage
        shell: bash
        run: |
          export VIRTUAL_ENV="$PWD/.venv-full"
          set -o pipefail
          fail_under=100
          [ "$RUNNER_OS" = "Linux" ] || fail_under=95
          poetry run python -m pytest --cov=src --cov=scripts --cov-report=term-missing \
            --cov-report=xml --cov-fail-under="$fail_under" -rf | tee pytest-output.txt

      # Which test failed is the only actionable part of a red run.
      # This step mattered most while the Windows leg carried
      # `continue-on-error` and a failure there left the run reading
      # "success" -- it is kept now that the leg blocks, because the
      # summary and the annotations still beat opening a matrix job's log
      # to find one line, and because a Windows-only failure is the one
      # this repo's Linux-assuming docs leave you least prepared for.
      #
      # (An earlier version of this comment claimed the logs were
      # unreadable without an actions:read scope. That was wrong -- the
      # logs endpoint 302s to a signed blob URL that rejects an
      # Authorization header, so a client that follows the redirect with
      # the header still attached gets a 401 that looks like a permission
      # error and isn't. Drop the header on the redirect and the logs read
      # fine. This step earns its place on visibility, not access.)
      - name: Report which tests failed
        if: failure()
        shell: bash
        run: |
          {
            echo "### Test failures on ${{ matrix.os }}"
            echo '```'
            sed -n '/short test summary info/,$p' pytest-output.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E '^(FAILED|ERROR) ' pytest-output.txt | while read -r line; do
            echo "::error::${{ matrix.os }}: ${line}"
          done

      # Codecov gets the run's coverage.xml, which the step above now emits
      # alongside the terminal report it already printed. Both matrix legs
      # upload under their own flag, because they measure different things
      # and merging them silently would hide that: the Linux leg installs
      # os-deps and runs the whole suite, the Windows leg gets python-deps
      # only, so ~30 render/pdf tests self-skip there and
      # src/render_output.py lands near 76%. Two flags keep those two
      # numbers separable in Codecov's UI, the same reason the two legs
      # hold two different --cov-fail-under floors here.
      #
      # `if: ${{ !cancelled() }}` rather than the default: a run that went
      # red on the coverage floor is exactly the run whose report is worth
      # looking at, and skipping the upload there would leave Codecov
      # showing the last *passing* commit as current.
      #
      # `fail_ci_if_error: false` is deliberate and worth revisiting once
      # the first upload is confirmed. The pass/fail decision on coverage
      # is already made locally by pyproject's `fail_under = 100`, which
      # needs no network -- so an upload problem (a missing token, a
      # Codecov outage, a rate limit) would be turning this repository's
      # CI red for something that is not a fact about the code. Flip it to
      # true if uploads prove reliable and you want a silent upload
      # failure to be loud.
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        # Pinned to a commit SHA rather than the `v5` tag (which currently
        # resolves to this same commit, v5.5.5) because the first SonarQube
        # analysis on this file flagged exactly this line: S7637, "use full
        # commit SHA hash for this dependency", MAJOR. A movable tag on a
        # third-party action that receives a token is the finding, and it
        # is a fair one. Bump this deliberately, by resolving the tag again,
        # rather than by tracking `v5` silently.
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: ./coverage.xml
          flags: ${{ matrix.os }}
          name: ${{ matrix.os }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: poetry check
        shell: bash
        run: |
          export VIRTUAL_ENV="$PWD/.venv-full"
          poetry check

  # SonarQube Cloud's static analysis, plus the quality-gate summary it
  # posts as a comment on the PR.
  #
  # Its own job rather than a step inside the `test` matrix above, and
  # ubuntu-only, because exactly one analysis per commit is the thing that
  # has to hold. Two scanners submitting the same commit under the same
  # `sonar.projectKey` don't add a second opinion -- the later one
  # overwrites the earlier one -- and Sonar's Python analysis reads source
  # text, so a Windows leg would find precisely what the Linux leg found
  # anyway. The matrix above is untouched by this job; the Windows leg
  # keeps running the suite exactly as before.
  sonarqube:
    name: SonarQube
    # `on: push:` at the top of this file is `tags-ignore`, not
    # `branches` -- deliberately, so a feature branch gets the test matrix
    # before any PR exists. Sonar wants the narrower set the request asked
    # for: pull requests, and commits that landed on main. This gate is
    # where that narrowing belongs, because doing it by adding
    # `branches: [main]` to `on: push:` would take the test matrix off
    # feature branches too.
    #
    # It also stops a double analysis. A push to a branch that already has
    # an open PR triggers this workflow twice, and the `concurrency` group
    # above cannot collapse the pair: the two runs carry different
    # `github.ref` values (`refs/heads/<branch>` versus
    # `refs/pull/N/merge`), so they land in different groups and neither
    # cancels the other. Without the gate that is two scans racing for one
    # commit -- the case the paragraph above says must not happen.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0, against the default depth-1 clone, because Sonar
      # attributes each issue to the commit that introduced it by reading
      # the git history. A shallow clone doesn't fail the scan; it quietly
      # costs new-code detection and blame, which is most of what the PR
      # comment is worth reading for.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The PR comment is posted server-side by the SonarQube Cloud GitHub
      # App, from the analysis this step submits -- not by this workflow.
      # That's why the job needs nothing beyond the read-only `permissions:`
      # at the top of the file: no `pull-requests: write` would help, and a
      # missing comment is an App-installation or SONAR_TOKEN problem rather
      # than a permissions one. The scanner reads the PR number, base branch
      # and head SHA out of the runner's own GITHUB_* environment, so none
      # of that is passed here; the project key and organisation come from
      # sonar-project.properties at the repo root.
      #
      # Pinned to a commit SHA rather than the `v8` tag: this is a
      # third-party action handling a credential, and a tag can be moved to
      # point at different code. Sonar's own S7637 makes the same point
      # about the Codecov action above, which is now pinned too.
      # `actions/checkout` is left on `@v4` at every call site in this file
      # -- it is GitHub's own action, and S7637 did not flag it.
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
