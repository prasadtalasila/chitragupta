name: Docs

# The domain is inherited from the user site: this repository must NOT contain a CNAME file.
# `branches` alone: adding `tags-ignore` to a branch-filtered push widens the trigger (#512/m-84).
on:
  push:
    branches: [main]
  pull_request:
    # improve-figures is deliberately PR-only, so it is never published.
    branches: [main, improve-figures]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Job-level permissions (Sonar S8264), so no future job inherits a grant.
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      # uv is pinned and wheels-only (Sonar S8544/S8541); bump with ci.yml, release.yml and
      # scripts/uv-requirements.txt together. Not install_full_pipeline.sh: that is the pipeline's install path.
      - name: Install the docs toolchain
        run: |
          pip install --only-binary ':all:' uv==0.13.9
          uv sync --locked --no-build --no-install-project --extra docs

      - name: Build the site
        run: uv run --no-sync mkdocs build --strict

      # --strict passed on a site with no theme CSS/JS (an over-broad exclude_docs), so check the built output.
      - name: Check every reference in the built site resolves
        run: |
          python3 - <<'PY'
          import pathlib, re, sys, urllib.parse

          site = pathlib.Path("site").resolve()
          base = re.search(r'^site_url:\s*\S+//[^/]+(/\S*?)/?$',
                           pathlib.Path("mkdocs.yml").read_text(), re.M)
          base = (base.group(1) + "/") if base else "/"

          def refs(text):
              """Every local reference in one page.

              `srcset` is included and split on its own grammar -- a comma
              separated candidate list, each entry a URL optionally followed
              by a descriptor (`logo.svg 2x`). Missing it would let the
              README's dark-mode logo, which is only ever reached through
              `srcset`, break silently while this guard stayed green.
              """
              for attr, value in re.findall(r'(href|src|srcset)="([^"]+)"', text):
                  if attr != "srcset":
                      yield value
                      continue
                  for candidate in value.split(","):
                      parts = candidate.strip().split()
                      if parts:
                          yield parts[0]

          missing = {}
          for html in sorted(site.rglob("*.html")):
              for ref in refs(html.read_text(errors="replace")):
                  if ref.startswith(("http://", "https://", "mailto:", "data:", "#", "//")):
                      continue
                  path = urllib.parse.unquote(ref.split("#")[0].split("?")[0])
                  if not path:
                      continue
                  # Absolute refs are rooted at the served base path (the
                  # 404 page uses them, since it can be served from any depth).
                  target = site / path[len(base):] if path.startswith(base) else html.parent / path
                  if not target.resolve().exists():
                      missing.setdefault(ref, set()).add(str(html.relative_to(site)))

          for ref, pages in sorted(missing.items()):
              print(f"::error::broken reference {ref} in {sorted(pages)[:4]}")

          # A belt-and-braces floor, in case a future theme stops being
          # reachable by reference-walking alone.
          for pattern in ("assets/stylesheets/*.css", "assets/javascripts/*.js"):
              if not list(site.glob(pattern)):
                  print(f"::error::no {pattern} in the built site")
                  missing[pattern] = set()

          print(f"{len(list(site.rglob('*.html')))} pages checked")
          sys.exit(1 if missing else 0)
          PY

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
