# Every `uses:` in .github/workflows/ is pinned to a full commit SHA with a
# `# vX.Y.Z` comment; Dependabot bumps both together, as one weekly grouped PR.
# The `uv==` pins live in `run:` lines no ecosystem reads; bump those by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
